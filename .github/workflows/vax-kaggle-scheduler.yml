name: Hourly Vaccination Kaggle Research Pipeline

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/vax-kaggle-scheduler.yml"
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"

permissions:
  contents: read

concurrency:
  group: vaccination-kaggle-hourly-orchestrator
  cancel-in-progress: false

jobs:
  advance:
    name: Verify results and start at most one next private notebook
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout research implementation
        uses: actions/checkout@v4
        with:
          ref: feature/kaggle-model-benchmark-v1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle API client
        run: python -m pip install --quiet "kaggle>=2.2,<3"
      - name: Advance gated Kaggle research pipeline
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/advance_kaggle.py
