name: benchmark unit tests

on:
  push:
    branches: [master, feature/kaggle-model-benchmark-v1]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q src
      - run: python -m pytest -q
