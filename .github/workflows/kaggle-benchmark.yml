name: Submit private Kaggle GPU sentiment benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = 100 records; full = 2,000 historical records, no Qwen"
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - full
  push:
    branches:
      - feature/kaggle-model-benchmark-v1
    paths:
      - "kaggle/launch-smoke.trigger"

permissions:
  contents: read

concurrency:
  group: kaggle-vax-submit-${{ github.event.inputs.mode || 'smoke' }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout research version
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kaggle API CLI
        run: python -m pip install --quiet "kaggle>=1.7,<2"
      - name: Submit versioned private GPU notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          BENCHMARK_MODE: ${{ github.event.inputs.mode || 'smoke' }}
        run: python scripts/submit_kaggle_benchmark.py
