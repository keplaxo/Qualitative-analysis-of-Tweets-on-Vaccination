name: Link vaccination Kaggle dataset preflight

on:
  workflow_dispatch:
  push:
    branches:
      - feature/kaggle-model-benchmark-v1
    paths:
      - ".github/workflows/kaggle-schema-preflight.yml"
      - "scripts/submit_kaggle_probe.py"
      - "kaggle/schema_probe.ipynb"

permissions:
  contents: read

concurrency:
  group: kaggle-vax-schema-probe
  cancel-in-progress: false

jobs:
  attach-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "kaggle>=1.7,<2"
      - name: Attach existing dataset to private Kaggle notebook and probe schema
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/submit_kaggle_probe.py
