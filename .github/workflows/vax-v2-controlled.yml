name: Vaccination Ontology V2 Controlled Experiment

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/vax-v2-controlled.yml"
  workflow_dispatch:
  schedule:
    - cron: "33 * * * *"

permissions:
  contents: read

concurrency:
  group: vaccination-v2-private-controlled-20261018
  cancel-in-progress: false

jobs:
  advance:
    name: Gated v2 model comparison and public benchmark preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experimental implementation
        uses: actions/checkout@v4
        with:
          ref: feature/kaggle-model-benchmark-v1
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kaggle API
        run: python -m pip install --quiet "kaggle>=2.2,<3"
      - name: Check upstream quality gates and start at most one stage
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/advance_v2.py
