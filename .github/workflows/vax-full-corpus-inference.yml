name: Vaccination Full Corpus Gated Inference

on:
  push:
    branches: [master]
    paths: [".github/workflows/vax-full-corpus-inference.yml"]
  workflow_dispatch:
  schedule:
    # Three short checks per hour; the controller enforces one new GPU submission\n    # per pass and a two-active-GPU ceiling. GitHub schedule is best effort.\n    - cron: "7,27,47 * * * *"

permissions:
  contents: read

concurrency:
  group: vax-full-corpus-private-inference-20261019
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kaggle-model-benchmark-v1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "kaggle>=2.2,<3" "six>=1.16,<2"
      - name: Restore validated-shard checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .vax_state/full_corpus_verified.json
          key: vax-private-shards-v1-${{ github.run_id }}
          restore-keys: |
            vax-private-shards-v1-
      - name: Preflight Python controller syntax
        run: python -m py_compile scripts/advance_full_corpus.py
      - name: Revalidate Kaggle reports with safe retry and submit at most one GPU stage
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/advance_full_corpus.py
      - name: Save validated-shard checkpoint
        if: ${{ always() && hashFiles('.vax_state/full_corpus_verified.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .vax_state/full_corpus_verified.json
          key: vax-private-shards-v1-${{ github.run_id }}
