name: Vaccine External Reference Dataset Preflight

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/vax-reference-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaccine-reference-preflight-20261018
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kaggle-model-benchmark-v1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "kaggle>=2.2,<3"
      - name: Start at most one CPU-only independent reference schema check
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/start_external_probe.py
