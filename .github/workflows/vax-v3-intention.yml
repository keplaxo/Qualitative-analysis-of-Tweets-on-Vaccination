name: Vaccination V3 Dual-Axis Pilot and Audit

on:
  push:
    branches: [master]
    paths: [".github/workflows/vax-v3-intention.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: vaccination-v3-private-development
  cancel-in-progress: false

jobs:
  advance:
    name: Run no more than one private gated research stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kaggle-model-benchmark-v1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "kaggle>=2.2,<3"
      - name: Advance v2 post-hoc audit and v3 exploratory experiment
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/advance_v3.py
