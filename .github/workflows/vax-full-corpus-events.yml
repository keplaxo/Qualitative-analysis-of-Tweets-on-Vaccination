name: Full Corpus Raw Tweet Event Weights

on:
  push:
    branches: [master]
    paths: [".github/workflows/vax-full-corpus-events.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaccination-full-corpus-private-event-weights-20261019
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kaggle-model-benchmark-v1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "kaggle>=2.2,<3"
      - name: Submit one private CPU raw-event weight backfill
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/submit_full_event_backfill.py
