name: Full Vaccination Corpus CPU Index

on:
  push:
    branches: [master]
    paths: [".github/workflows/vax-full-corpus-index.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vax-full-corpus-private-index-20261019
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kaggle-model-benchmark-v1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "kaggle>=2.2,<3"
      - name: Submit private CPU corpus streaming and deduplication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/submit_full_corpus_index.py
