name: Find owned Kaggle vaccination dataset

on:
  workflow_dispatch:
  push:
    branches:
      - feature/kaggle-model-benchmark-v1
    paths:
      - ".github/workflows/kaggle-dataset-discovery.yml"
      - "scripts/discover_kaggle_dataset.py"

permissions:
  contents: read

jobs:
  discover:
    name: Find existing Kaggle dataset by metadata
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout discovery code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --quiet "kaggle>=1.7,<2"
      - name: Find vaccination dataset without downloading tweets
        id: discover
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/discover_kaggle_dataset.py
      - name: Summary
        if: success()
        shell: bash
        run: |
          echo "Metadata lookup complete; no raw tweets were downloaded." >> "$GITHUB_STEP_SUMMARY"
          echo "Review the matched dataset handles and filenames in the discovery logs." >> "$GITHUB_STEP_SUMMARY"
