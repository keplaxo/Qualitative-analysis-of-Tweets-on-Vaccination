[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaxbench"
version = "0.1.0"
description = "Reproducible benchmark for vaccination tweet sentiment and stance"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]
